services:
  # Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: vulnpilot
      POSTGRES_USER: vulnpilot
      POSTGRES_PASSWORD: vulnpilot_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnpilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vulnpilot-network

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vulnpilot-network

  # MongoDB for Node.js backend
  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: vulnpilot
      MONGO_INITDB_ROOT_PASSWORD: vulnpilot_password
      MONGO_INITDB_DATABASE: vulnpilot
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vulnpilot-network


  fastapi-backend:
    build: 
      context: ./fastapi-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./fastapi-backend:/app
      - scan_results:/app/scans
      - logs_data:/app/logs
      - chroma_cache:/root/.cache/chroma
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - vulnpilot-network

  # Node.js Backend (API & AI Service)
  node-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - node_logs:/app/logs
      - node_data:/app/data
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://vulnpilot:vulnpilot_password@mongodb:27017/vulnpilot?authSource=admin
      - REDIS_URL=redis://redis:6379/1
      - DJANGO_API_URL=http://fastapi-backend:8000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      fastapi-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - vulnpilot-network

  # React Frontend
  react-frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      fastapi-backend:
        condition: service_healthy
      node-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - vulnpilot-network

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  scan_results:
    driver: local
  logs_data:
    driver: local
  node_logs:
    driver: local
  node_data:
    driver: local
  chroma_cache:
    driver: local

networks:
  vulnpilot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
